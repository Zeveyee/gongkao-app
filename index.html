<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#9698E7">
  <meta name="apple-mobile-web-app-title" content="考公备考">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>考公备考助手</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tabbar.css">
  <link rel="stylesheet" href="css/today.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/practice.css">
  <link rel="stylesheet" href="css/notebook.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/weight.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>
  <div id="app">
    <div id="page-container">
      <!-- 页面动态加载 -->
    </div>
    <nav id="tabbar">
      <div class="tab-item active" data-tab="today">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V9h14v10zM5 7V5h14v2H5z"/></svg>
        <span>今日计划</span>
      </div>
      <div class="tab-item" data-tab="practice">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        <span>刷题记录</span>
      </div>
      <div class="tab-item" data-tab="notebook">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg>
        <span>题本库</span>
      </div>
      <div class="tab-item" data-tab="stage">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        <span>阶段总览</span>
      </div>
      <div class="tab-item" data-tab="weight">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>

      </div>
      <div class="tab-item" data-tab="settings">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>设置</span>
      </div>
    </nav>
  </div>

  <!-- 全局弹窗容器 -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;"></div>
  <div id="modal-box" class="modal-box" style="display:none;"></div>

  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/today.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/notebook.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/weight.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 注册 Service Worker 实现离线可用
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW注册失败', err));
      });
    }
  </script>
</body>
</html>
